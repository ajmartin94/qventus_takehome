# Agent settings only: which adapter backs each port, and model and effort per prompt.
#
# Hospital rules (block release, schedule close, readiness deadlines, routing, autonomy)
# are NOT configured here. They belong to the hospital and are read through ports; in
# the prototype they live in the simulated hospital under fixtures/.

# Where the simulated hospital lives. Read only by fixture-backed adapters.
fixtures_dir: fixtures

# Versioned prompt templates (prompts/<id>.<version>.md).
prompts_dir: prompts

ports:
  clock:
    adapter: frozen
    settings: {at: "2026-10-14T09:00:00"}   # demos and tests run at Wed Oct 14, 2026 09:00
  audit_log:
    adapter: jsonl
    settings: {path: var/audit.jsonl}
  store:
    adapter: memory      # or sqlite, with settings: {path: var/requests.sqlite3}

  # The simulated hospital's systems (fixtures/). A real site swaps these for adapters
  # that talk to its EHR and scheduling system; nothing else changes.
  scheduling:        {adapter: mock}
  directory:         {adapter: fixture}
  duration_history:  {adapter: csv}
  policy_store:      {adapter: fixture}

  # Stubs: they record what they would do and never pretend to deliver.
  document_ingest:   {adapter: fixture}     # pre-transcribed fax, email and call text
  event_source:      {adapter: simulated}   # events injected from the CLI or a scenario
  outbox:            {adapter: drafts}      # drafts only; nothing is sent
  readiness_handoff: {adapter: recorded}

  # The model. `scripted` replays scenario scripts with no network (tests, offline demos).
  # `anthropic` calls Claude; `--live` on `replay` and `chat` switches to it for one command.
  # Its settings: {fallbacks: default, timeout_seconds: 120, max_tokens: 16000}. The key comes
  # from ANTHROPIC_API_KEY (environment or .env).
  llm:               {adapter: scripted}

llm:
  default_model: claude-opus-5-5
  prompts:
    interpret_turn:    {model: claude-opus-5-5, effort: medium}
    extract_document:  {model: claude-opus-5-5, effort: medium}
    ask_clarification: {model: claude-opus-5-5, effort: low}
    explain_options:   {model: claude-opus-5-5, effort: low}
    summarize_outcome: {model: claude-opus-5-5, effort: low}

conversation:
  # The agent's own setting, not the hospital's: clarification attempts before a person takes over.
  max_clarification_attempts: 3
