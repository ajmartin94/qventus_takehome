# Block schedule: weekly allocations of a room's prime time to an owner (a surgeon or a
# service group). Time no block covers is open time.
#
# Each block carries its own release horizon: unbooked time in the block returns to the
# open pool `days_before` days before the surgery date, at `at`. Northwind's robotic
# blocks release 14 days ahead and its standard blocks 7 days ahead, both at 07:00.
#
# `filler: true` marks blocks no scenario touches; the simulation treats them as fully
# booked by cases it doesn't list.

release_horizons:
  robotic: &robotic {days_before: 14, at: "07:00"}
  standard: &standard {days_before: 7, at: "07:00"}

groups:
  G-GENSURG: General surgery group
  G-ENT: ENT group
  G-ORTHO: Orthopedic group
  G-GYN: GYN group
  G-CARDIAC: Cardiac surgery group
  G-OPHTH: Ophthalmology group

blocks:
  # OR-1, OR-2, OR-4: group filler, mostly booked
  - {id: B-GENSURG-MON-OR1, owner: G-GENSURG, room: OR-1, weekday: mon, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GENSURG-TUE-OR1, owner: G-GENSURG, room: OR-1, weekday: tue, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GENSURG-WED-OR1, owner: G-GENSURG, room: OR-1, weekday: wed, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GENSURG-THU-OR1, owner: G-GENSURG, room: OR-1, weekday: thu, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GENSURG-FRI-OR1, owner: G-GENSURG, room: OR-1, weekday: fri, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-ENT-MON-OR2, owner: G-ENT, room: OR-2, weekday: mon, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-ENT-TUE-OR2, owner: G-ENT, room: OR-2, weekday: tue, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-ENT-WED-OR2, owner: G-ENT, room: OR-2, weekday: wed, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-ENT-THU-OR2, owner: G-ENT, room: OR-2, weekday: thu, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-ENT-FRI-OR2, owner: G-ENT, room: OR-2, weekday: fri, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GYN-MON-OR4, owner: G-GYN, room: OR-4, weekday: mon, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GYN-TUE-OR4, owner: G-GYN, room: OR-4, weekday: tue, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GYN-WED-OR4, owner: G-GYN, room: OR-4, weekday: wed, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GYN-THU-OR4, owner: G-GYN, room: OR-4, weekday: thu, start: "07:30", end: "15:30", release: *standard, filler: true}
  - {id: B-GYN-FRI-OR4, owner: G-GYN, room: OR-4, weekday: fri, start: "07:30", end: "15:30", release: *standard, filler: true}

  # OR-3: orthopedic. Wednesday is open time.
  - {id: B-CHEN-MON-OR3, owner: S-CHEN, room: OR-3, weekday: mon, start: "07:30", end: "15:30", release: *standard}
  - {id: B-ORTHO-TUE-OR3, owner: G-ORTHO, room: OR-3, weekday: tue, start: "07:30", end: "15:30", release: *standard, filler: true}
