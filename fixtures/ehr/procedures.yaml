# Procedure master. Each entry's attributes decide which rooms and shared equipment can
# host the case and which booking strategy applies: an ICU post-op destination selects
# OR-plus-ICU-bed booking, a tandem-eligible procedure selects parallel-room booking.
# Aliases are the words people write; the directory matches requests against them.

- id: TKA-ROBOTIC
