id: demo-07-cardiac-stub
title: A cardiac case selects the OR-plus-ICU-bed strategy, a stub, and routes to a person
clock: 2026-10-14T09:00:00

input:
  channel: chat
  message: "CABG for Linda Novak, DOB 1/24/1955, with Dr. Lee, week of 11/2."

scripted_interpretations:
  - intent: new_request
    mentions:
      - {field: procedure,    value: "CABG",                  evidence: "CABG"}
      - {field: patient_name, value: "Linda Novak",           evidence: "Linda Novak"}
      - {field: patient_dob,  value: "1955-01-24",            evidence: "DOB 1/24/1955"}
      - {field: surgeon,      value: "Dr. Lee",               evidence: "with Dr. Lee"}
      - {field: date_window,  value: "2026-11-02/2026-11-06", evidence: "week of 11/2"}

expect:
  final_state: RoutedOut
  path_includes: [Intake, Matching, Collecting, Searching, RoutedOut]
  path_excludes: [Presenting, Holding]
  route_to: [coordinator]
  replies_include: ["OR plus ICU bed booking", "isn't supported in the prototype", "rooms_and_equipment.md#cases-the-scheduling-office-books-by-hand"]
  never: [booked]
